name: Feature request
description: Suggest a rule, report improvement, or workflow feature.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scoring / deductions
        - Dependency audit
        - GitHub health
        - Reports / handover
        - Scan progress / performance
        - Localization
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This proposal can stay local/offline by default.
          required: true
